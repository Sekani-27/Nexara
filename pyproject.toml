[tool.ruff.lint.per-file-ignores]
"health_server.py" = ["E402"]
"run_multi.py" = ["E402"]
"run_sbonelo.py" = ["E402"]
"trader_copilot/engine.py" = ["E402"]
"trader_copilot/ml/confidence_model.py" = ["E402"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
update_changelog_on_bump = true

# Enforce these commit types only
[tool.commitizen.customize]
schema_pattern = "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\\(.+\\))?!?:\\s.+"
