name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write        # create tags and releases
  pull-requests: write   # open the release PR

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: python
          token: ${{ secrets.GITHUB_TOKEN }}
