name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Restrict default token permissions — least privilege
permissions:
  contents: read
  packages: write      # needed for GHCR push
  id-token: write      # OIDC (future use)

jobs:
  # ─────────────────────────────────────────
  # STAGE 1: Lint (fast feedback, ~30s)
  # ─────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: lint-${{ hashFiles('requirements.txt') }}

      - name: Install lint tools
        run: pip install black==24.4.2 ruff==0.4.4 --quiet

      - name: black (format check)
        run: black --check .

      - name: ruff (lint)
        run: ruff check .

  # ─────────────────────────────────────────
  # STAGE 2: Test (only runs if lint passes)
  # ─────────────────────────────────────────
  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: test-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -v \
            --ignore=trader_copilot/tests/test_ml_engine.py \
            --ignore=trader_copilot/tests/test_phase3.py \
            --junitxml=test-results.xml

      - name: Upload test results
        if: always()    # upload even on failure so you can inspect
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          retention-days: 14

  # ─────────────────────────────────────────
  # STAGE 3: Docker build + push to GHCR
  # Only runs on push to main (not on PRs)
  # ─────────────────────────────────────────
  build:
    name: Build & Push
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # built-in, no setup needed

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────
  # STAGE 4a: Deploy Ntando's instance
  # ─────────────────────────────────────────
  deploy-ntando:
    name: Deploy (Ntando)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production-ntando
      url: https://genuvia-edge.up.railway.app

    steps:
      - name: Trigger Railway deploy — Ntando
        run: |
          curl --silent --fail --show-error \
            -X POST "${{ secrets.RAILWAY_DEPLOY_WEBHOOK_NTANDO }}"

  # ─────────────────────────────────────────
  # STAGE 4b: Deploy Sbonelo's instance
  # ─────────────────────────────────────────
  deploy-sbonelo:
    name: Deploy (Sbonelo)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production-sbonelo

    steps:
      - name: Trigger Railway deploy — Sbonelo
        run: |
          curl --silent --fail --show-error \
            -X POST "${{ secrets.RAILWAY_DEPLOY_WEBHOOK_SBONELO }}"
